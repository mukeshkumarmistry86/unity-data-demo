<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>City Data Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h1 class="mb-4">🌍 City Data Admin Panel</h1>
    
    <div class="card mb-4">
      <div class="card-header">Add New City</div>
      <div class="card-body">
        <form id="cityForm" enctype="multipart/form-data">
          <div class="row g-3">
            <div class="col-md-4">
              <label>City Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="col-md-4">
              <label>Country</label>
              <input type="text" class="form-control" id="country" required>
            </div>
            <div class="col-md-4">
              <label>Population</label>
              <input type="number" class="form-control" id="population" required>
            </div>
            <div class="col-md-12">
              <label>Description</label>
              <textarea class="form-control" id="description" rows="2" required></textarea>
            </div>
            <div class="col-md-6">
              <label>City Image</label>
              <input type="file" class="form-control" id="image" accept="image/*" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">Upload City</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Cities in Database</div>
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr><th>Image</th><th>Name</th><th>Country</th><th>Population</th><th>Actions</th></tr>
          </thead>
          <tbody id="citiesTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadCities() {
      const res = await fetch('/api/cities');
      const cities = await res.json();
      document.getElementById('citiesTable').innerHTML = cities.map(city => `
        <tr>
          <td><img src="${city.imageUrl}" width="60" height="40" style="object-fit:cover; border-radius:4px;"></td>
          <td>${city.name}</td>
          <td>${city.country}</td>
          <td>${city.population.toLocaleString()}</td>
          <td><button class="btn btn-sm btn-danger" onclick="deleteCity('${city._id}')">Delete</button></td>
        </tr>
      `).join('');
    }

    document.getElementById('cityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('name', document.getElementById('name').value);
      formData.append('country', document.getElementById('country').value);
      formData.append('population', document.getElementById('population').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('image', document.getElementById('image').files[0]);

      await fetch('/api/cities', { method: 'POST', body: formData });
      e.target.reset();
      loadCities();
    });

    async function deleteCity(id) {
      if (!confirm('Delete this city?')) return;
      await fetch(`/api/cities/${id}`, { method: 'DELETE' });
      loadCities();
    }

    loadCities();
  </script>
</body>
</html>
